<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ui — solidjs on serverless</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; }
  main { max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  h1 span { color: #76b3f0; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: .5rem 1rem; cursor: pointer; }
  button + button { margin-left: .5rem; background: #1f6feb; }
  input { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: .5rem; width: 60%; }
  pre { background: #0d1117; padding: .75rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  .count { font-size: 2rem; font-weight: bold; }
</style>
</head>
<body>
<main id="app"><p>loading…</p></main>
<script type="module">
import { createSignal } from "https://esm.sh/solid-js@1.9.3";
import { render } from "https://esm.sh/solid-js@1.9.3/web";
import h from "https://esm.sh/solid-js@1.9.3/h";

function App() {
  const [count, setCount] = createSignal(0);
  const [msg, setMsg] = createSignal("hello from the browser");
  const [echoOut, setEchoOut] = createSignal("press the button…");

  async function callEcho() {
    setEchoOut("calling…");
    try {
      const res = await fetch("/f/echo/call", { method: "POST", body: msg() });
      setEchoOut(await res.text());
    } catch (e) {
      setEchoOut("error: " + e);
    }
  }

  return h("div", null,
    h("h1", null, "solidjs view served by ", h("span", null, "fn=ui")),
    h("div", { class: "card" },
      h("div", { class: "count" }, count),
      h("p", null,
        h("button", { onClick: () => setCount(count() - 1) }, "-"),
        h("button", { onClick: () => setCount(count() + 1) }, "+"),
      ),
    ),
    h("div", { class: "card" },
      h("p", null, "Calls the live echo function:"),
      h("p", null,
        h("input", { value: msg(), onInput: (e) => setMsg(e.target.value) }),
        " ",
        h("button", { onClick: callEcho }, "call /f/echo"),
      ),
      h("pre", null, echoOut),
    ),
  );
}

render(App, document.getElementById("app"));
</script>
</body>
</html>
