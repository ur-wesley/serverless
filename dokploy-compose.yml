services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile.controlplane
    expose:
      - "8080"
    environment:
      PORT: "8080"
      NATS_URL: "nats://nats:4222"
      RUSTFS_ENDPOINT: "http://rustfs:9000"
      RUSTFS_ACCESS_KEY: "minioadmin"
      RUSTFS_SECRET_KEY: "minioadmin"
      SQLITE_PATH: "/data/actions.db"
      ARTIFACTS_DIR: "/data/bundles"
      RUNNER_NETWORK: "actions-net"
      RUNNER_SANDBOX_NET: "actions-sandbox"
      RUNNER_HOST_GW: "host.docker.internal"
      HELLO_IMAGE: "hello-ts:latest"
      ACTIONS_SIDECAR_URL: "http://controlplane:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - controlplane-data:/data
    depends_on:
      - nats
      - rustfs
    networks:
      - actions-net
      - actions-sandbox

  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data"]
    expose:
      - "4222"
      - "8222"
    volumes:
      - nats-data:/data
    networks:
      - actions-net

  rustfs:
    image: rustfs/rustfs:latest
    expose:
      - "9000"
    environment:
      RUSTFS_ACCESS_KEY: "minioadmin"
      RUSTFS_SECRET_KEY: "minioadmin"
    volumes:
      - rustfs-data:/data
    networks:
      - actions-net

networks:
  actions-net:
    name: actions-net
    driver: bridge
  actions-sandbox:
    name: actions-sandbox
    driver: bridge
    internal: true

volumes:
  controlplane-data:
  nats-data:
  rustfs-data:
