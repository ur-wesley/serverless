syntax = "proto3";

package actions.v1;

option go_package = "github.com/ur-wesley/oort/gen/go/actions/v1;actionsv1";

// Sidecar API available to handler binaries via $ACTIONS_SIDECAR_URL.
// Backed by NATS KV (small KV) + SQLite meta, RustFS (blobs),
// NATS JetStream (queue), stdout/slog (logs).
service KvService {
  rpc KvGet(KvGetRequest) returns (KvGetResponse);
  rpc KvPut(KvPutRequest) returns (KvPutResponse);
  rpc KvDel(KvDelRequest) returns (KvDelResponse);
}

service BlobService {
  rpc BlobPutUrl(BlobPutUrlRequest) returns (BlobPutUrlResponse);
  rpc BlobGetUrl(BlobGetUrlRequest) returns (BlobGetUrlResponse);
}

service QueueService {
  rpc QueuePublish(QueuePublishRequest) returns (QueuePublishResponse);
}

service LogService {
  rpc LogAppend(LogAppendRequest) returns (LogAppendResponse);
  // Intercom: tail another function's logs when allow_logs + same owner.
  rpc LogTail(LogTailRequest) returns (LogTailResponse);
}

service IntercomService {
  // List own functions (names only) for dashboard discovery.
  rpc FunctionsList(FunctionsListRequest) returns (FunctionsListResponse);
  // Invoke another function when allow_invoke + same owner.
  rpc InvokeOther(InvokeOtherRequest) returns (InvokeOtherResponse);
}

message KvGetRequest {
  string function_name = 1;
  string key = 2;
}
message KvGetResponse {
  bytes value = 1;
  bool found = 2;
}
message KvPutRequest {
  string function_name = 1;
  string key = 2;
  bytes value = 3;
  int64 ttl_seconds = 4;
}
message KvPutResponse {}
message KvDelRequest {
  string function_name = 1;
  string key = 2;
}
message KvDelResponse {}

message BlobPutUrlRequest {
  string function_name = 1;
  string key = 2;
  int64 expires_seconds = 3;
}
message BlobPutUrlResponse {
  string url = 1;
}
message BlobGetUrlRequest {
  string function_name = 1;
  string key = 2;
  int64 expires_seconds = 3;
}
message BlobGetUrlResponse {
  string url = 1;
}

message QueuePublishRequest {
  string topic = 1;
  bytes message = 2;
}
message QueuePublishResponse {}

message LogAppendRequest {
  string function_name = 1;
  string version = 2;
  string request_id = 3;
  string line = 4;
}
message LogAppendResponse {}

message LogTailRequest {
  // target_function preferred; function_name accepted as alias (JSON API).
  string target_function = 1;
  string function_name = 2;
  int32 limit = 3;
}
message LogLine {
  string function = 1;
  string version = 2;
  string request_id = 3;
  string line = 4;
  string time = 5;
}
message LogTailResponse {
  repeated LogLine lines = 1;
}

message FunctionsListRequest {}
message FunctionsListResponse {
  repeated string functions = 1;
}

message InvokeOtherRequest {
  string target_function = 1;
  string function_name = 2;
  string method = 3;
  string path = 4;
  map<string, string> headers = 5;
  map<string, string> query = 6;
  bytes body = 7;
}
message InvokeOtherResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}
