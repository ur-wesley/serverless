syntax = "proto3";

package actions.v1;

option go_package = "actions/gen/go/actions/v1;actionsv1";

// Raw HTTP event delivered to the handler binary.
message HttpEvent {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  map<string, string> query = 4;
  bytes body = 5;
}

// Invocation context (function identity, timeouts, tracing).
message InvokeContext {
  string function_name = 1;
  string version = 2;
  string request_id = 3;
  int64 deadline_ms = 4;
  string sidecar_url = 5;
}

message InvokeRequest {
  HttpEvent event = 1;
  InvokeContext ctx = 2;
}

message InvokeResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}
